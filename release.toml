name = "lawless-td-owl-patch"
display_name = "Lawless - Tamrielic Distribution - OWL Patch"
version = "0.1.0"
description = "Restores Tamrielic Distribution outfits on 14 Lawless NPCs when using the Open World Loot patch. ESL-flagged, no assets."

# archive path = source path (relative to this folder); dist/ is written by: python3 build.py --write
[files]
"Lawless - Tamrielic Distribution - OWL Patch.esp" = "dist/Lawless - Tamrielic Distribution - OWL Patch.esp"
"LICENSE" = "LICENSE"
"THIRD-PARTY-NOTICES.txt" = "THIRD-PARTY-NOTICES.txt"

[nexus]
mod_category = 84  # Nexus mod category: Patches; written as category= in the github .meta

[github]
repo = "kxgcayh/lawless-td-owl-patch"
